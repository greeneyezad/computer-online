services:
  web:
    image: node:22
    working_dir: /workspace
    restart: on-failure
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
      - node-modules:/workspace/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    labels:
      - base44.project=Precision 16s Desktop
      - base44.kind=web
      - base44.port=3000

volumes:
  node-modules:
